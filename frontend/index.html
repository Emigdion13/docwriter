<!doctype html>
<html lang="en" data-theme="nebula">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:5173 http://localhost:5173; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>VaultNotes</title>
</head>
<body>

  <!-- Living background: aurora blobs + grid -->
  <div class="backdrop" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob ba"></div>
    <div class="grid"></div>
  </div>

  <!-- App Main Grid -->
  <div class="app" id="app">
    <!-- Toolbar -->
    <header class="toolbar glass" id="toolbar"></header>

    <!-- Sidebar -->
    <aside class="sidebar glass" id="sidebar"></aside>

    <!-- Note List -->
    <section class="notelist glass" id="notelist" aria-label="Notes"></section>

    <!-- Workspace -->
    <main class="workspace glass view-split" id="workspace">
      <div class="ws-note">
        <div class="ws-head">
          <div class="ws-title-wrap">
            <div class="crumb" id="crumb"></div>
            <input class="title-input" id="title" spellcheck="false" aria-label="Note title">
          </div>
          <div class="ws-actions">
            <span class="meta" id="meta"></span>
            <button class="btn icon" id="back" aria-label="Back (Alt Left)" title="Back (Alt ←)">
              <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            </button>
            <button class="btn icon" id="fwd" aria-label="Forward (Alt Right)" title="Forward (Alt →)">
              <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <button class="btn icon" id="move" aria-label="Move to another space" title="Move to another space">
              <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>
            </button>
            <button class="btn icon" id="trash" aria-label="Move to trash" title="Move to trash">
              <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
            </button>
          </div>
        </div>
        <div class="panes" id="panes">
          <div class="pane editor">
            <span class="pane-label">Markdown</span>
            <div id="cm-editor" style="position:absolute; inset:0;"></div>
          </div>
          <div class="pane preview-pane">
            <span class="pane-label">Preview</span>
            <article class="preview" id="preview"></article>
          </div>
        </div>
        <div class="backlinks" id="backlinks"></div>
      </div>

      <!-- Sealed hero container will be placed here -->
      <div id="sealed-hero-container"></div>
      <!-- Empty hero container will be placed here -->
      <div id="empty-hero-container"></div>
    </main>

    <!-- Status Bar -->
    <footer class="statusbar glass" id="statusbar"></footer>
  </div>

  <!-- Overlays -->
  <div id="overlays-root"></div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
